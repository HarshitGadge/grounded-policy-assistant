name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with RAGBench, to check it reads the corpus)
        run: pip install -e '.[dev]' ragbench-eval
      - name: Test
        run: pytest -rs --cov=policy_assistant --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel in a clean venv and run the CLI
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/policy-assistant --version
          /tmp/venv/bin/policy-assistant corpus --help

  live-ecfr:
    # Builds the default corpus from the real eCFR and checks it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Probe eCFR's API (diagnostics)
        continue-on-error: true
        run: |
          base=https://www.ecfr.gov/api/versioner/v1
          d=$(curl -s "$base/titles.json" | python -c "import json,sys; print([t for t in json.load(sys.stdin)['titles'] if t['number']==12][0])")
          echo "title 12: $d"
          for u in "$base/full/2026-11-24/title-12.xml?part=1005" \
                   "$base/full/2026-11-24/title-12.xml?part=1005&section=1005.6" \
                   "$base/full/2026-11-20/title-12.xml?part=1005" \
                   "$base/full/2026-11-24/title-12.xml?chapter=X&part=1005" \
                   "$base/structure/2026-11-24/title-12.json" ; do
            for a in "application/xml" "*/*" ""; do
              code=$(curl -s -o /tmp/body -w '%{http_code} %{content_type} %{size_download}' ${a:+-H "Accept: $a"} "$u")
              echo "[$a] $u -> $code"; head -c 300 /tmp/body; echo
            done
          done
      - name: Build the corpus from eCFR
        run: policy-assistant corpus build --date latest --out data/corpus
      - name: Summarise it
        run: |
          policy-assistant corpus stats data/corpus --show 5
          cat data/corpus/manifest.json
      - name: Show eCFR's XML for one section and one interpretation
        run: |
          xml=$(ls data/corpus/raw/title-12-part-1005-*.xml)
          python scripts/inspect_ecfr.py "$xml" 1005.6
          python scripts/inspect_ecfr.py "$xml" "Supplement I to Part 1005"
      - name: Print sample citations
        run: |
          python - <<'PY'
          from policy_assistant.corpus import load_corpus
          rows = load_corpus("data/corpus")
          for r in rows[::max(1, len(rows) // 40)]:
              print(r["citation"], "|", r["text"][:90].replace("\n", " "))
          PY
      - name: Check it
        run: pytest -m live -rs tests/live
        env:
          GPA_CORPUS: data/corpus
      - uses: actions/upload-artifact@v4
        with:
          name: corpus
          path: data/corpus/
          retention-days: 14
