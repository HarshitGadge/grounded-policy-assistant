name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with RAGBench, to check it reads the corpus and runs the retriever)
        run: pip install -e '.[dev]' ragbench-eval 'streamlit>=1.40'
      - name: Test
        run: pytest -rs --cov=policy_assistant --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel in a clean venv and run the CLI
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/policy-assistant --version
          /tmp/venv/bin/policy-assistant corpus --help
          /tmp/venv/bin/policy-assistant index build --help
          /tmp/venv/bin/policy-assistant search --help
          /tmp/venv/bin/policy-assistant ask --help

  live:
    # Builds the default corpus from the real eCFR, indexes it in Qdrant with the real
    # embedding model, and checks both and the agent. The agent's Claude checks run only
    # if the ANTHROPIC_API_KEY repository secret is set, and its OpenRouter checks only if
    # OPENROUTER_API_KEY is; without them they are skipped. The OpenRouter model is the
    # OPENROUTER_MODEL repository variable, or a free model if that isn't set.
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
      GPA_CORPUS: data/corpus
      GPA_QDRANT: data/qdrant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,fastembed,eval,app]'
      - name: Install RAGBench from GitHub (recall at any cutoff is not on PyPI yet)
        # ragbench-eval 1.1.1 on PyPI reports recall only at 10 and 100. --recall-k was
        # added on main in HarshitGadge/ragbench PR 16; this pins that commit. Drop this
        # step once a release has it, and raise the eval extra's minimum to that release.
        run: pip install --force-reinstall --no-deps "ragbench-eval @ git+https://github.com/HarshitGadge/ragbench@64d260ebd4836bf0f33372e214d0f1f739e96f36"
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Build the corpus from eCFR
        run: policy-assistant corpus build --date latest --out data/corpus
      - name: Summarise it
        run: |
          policy-assistant corpus stats data/corpus --show 3
          cat data/corpus/manifest.json
      - name: Index it in Qdrant
        run: policy-assistant index build --corpus data/corpus --qdrant data/qdrant
      - name: Show what a few questions retrieve
        run: |
          policy-assistant search "How much can a consumer lose if they report a lost debit card within two business days?" -k 3
          policy-assistant search "When must a financial institution give a customer its initial privacy notice?" -k 3
          policy-assistant search "Can a creditor ask an applicant about their marital status?" -k 3
      - name: Ask the agent a few questions, with the extractive answerer (no model)
        run: |
          policy-assistant ask --answerer extractive "When must a financial institution provide an initial privacy notice to a customer?"
          policy-assistant ask --answerer extractive "How many weeks of unpaid family leave must an employer give?"
      - name: Ask Claude the same questions
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          policy-assistant ask "When must a financial institution provide an initial privacy notice to a customer?"
          policy-assistant ask "How many weeks of unpaid family leave must an employer give?"
      - name: Ask a model on OpenRouter
        if: env.OPENROUTER_API_KEY != ''
        # Shown for reading only; the checks below decide. A free model may be rate limited.
        continue-on-error: true
        run: |
          policy-assistant ask --answerer openrouter "When must a financial institution provide an initial privacy notice to a customer?"
      - name: Check them
        run: pytest -m live -rs -s tests/live
      - name: Build the evaluation set (hand-labeled questions over this corpus)
        run: policy-assistant eval build --corpus data/corpus --out data/regulations-qa
      - name: Score retrieval with RAGBench (dense Qdrant vs BM25)
        run: |
          ragbench run --data data/regulations-qa --retriever policy_assistant.retriever:QdrantRetriever \
            --param model=BAAI/bge-small-en-v1.5 --name qdrant-bge-small --recall-k 5,10,100 --out results/retrieval__qdrant.json --quiet
          ragbench run --data data/regulations-qa --retriever ragbench.retrievers.bm25:BM25 \
            --name bm25 --recall-k 5,10,100 --out results/retrieval__bm25.json --quiet
          # recall@5 matches what the agent reads: the top 5 chunks.
          ragbench report results/retrieval__*.json --metric ndcg@10 --metric recall@5 \
            --metric recall@10 --metric recall@100 --metric mrr@10 | tee -a "$GITHUB_STEP_SUMMARY"
          ragbench compare results/retrieval__bm25.json results/retrieval__qdrant.json \
            --metric ndcg@10 --metric recall@5 --metric recall@10 --metric mrr@10
      - name: Score the agent with the extractive answerer (no model, no key)
        # Model answerers are not run here: the full set is about 60 questions, which is
        # billed per question on Anthropic and over the daily limit of OpenRouter's free
        # models. Run them with: policy-assistant eval agent --answerer <name>
        run: |
          policy-assistant eval agent --answerer extractive --out results/agent__extractive.json
          policy-assistant eval report results/agent__*.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: corpus
          path: data/corpus/
          retention-days: 14
