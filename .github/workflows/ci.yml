name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with RAGBench, to check it reads the corpus and runs the retriever)
        run: pip install -e '.[dev]' ragbench-eval
      - name: Test
        run: pytest -rs --cov=policy_assistant --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel in a clean venv and run the CLI
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/policy-assistant --version
          /tmp/venv/bin/policy-assistant corpus --help
          /tmp/venv/bin/policy-assistant index build --help
          /tmp/venv/bin/policy-assistant search --help

  live:
    # Builds the default corpus from the real eCFR, indexes it in Qdrant with the real
    # embedding model, and checks both.
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
      GPA_CORPUS: data/corpus
      GPA_QDRANT: data/qdrant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,fastembed]'
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Build the corpus from eCFR
        run: policy-assistant corpus build --date latest --out data/corpus
      - name: Summarise it
        run: |
          policy-assistant corpus stats data/corpus --show 3
          cat data/corpus/manifest.json
      - name: Index it in Qdrant
        run: policy-assistant index build --corpus data/corpus --qdrant data/qdrant
      - name: Show what a few questions retrieve
        run: |
          policy-assistant search "How much can a consumer lose if they report a lost debit card within two business days?" -k 3
          policy-assistant search "When must a financial institution give a customer its initial privacy notice?" -k 3
          policy-assistant search "Can a creditor ask an applicant about their marital status?" -k 3
      - name: Check them
        run: pytest -m live -rs tests/live
      - uses: actions/upload-artifact@v4
        with:
          name: corpus
          path: data/corpus/
          retention-days: 14
