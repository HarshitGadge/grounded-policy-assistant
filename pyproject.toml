[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "grounded-policy-assistant"
version = "0.1.0"
description = "Answers questions about U.S. regulations with a citation for every claim, and refuses when the text doesn't support an answer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Harshit Gadge" }]
keywords = ["rag", "agentic-rag", "langgraph", "qdrant", "regulation", "ecfr", "citations"]
dependencies = ["qdrant-client>=1.16", "langgraph>=1.0", "anthropic>=2.14"]

[project.optional-dependencies]
fastembed = ["fastembed>=0.5"]
eval = ["ragbench-eval>=1.1.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
policy-assistant = "policy_assistant.cli:main"

[project.urls]
Repository = "https://github.com/HarshitGadge/grounded-policy-assistant"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: downloads from eCFR or Hugging Face, or calls the Anthropic API (run with -m live)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
